    need_pci: true
    terminal_rights: unknown
    flow_final: unknown
  debit_wof_finish:
    documented: true
    method: RegisterOrderFromCardFinish
    path: /api/v1/card/unregistered/debit/wof/finish
    terminal_rights: unknown
