  wof_3ds2:
    documented: true
    methods:
      check: /api/v1/card/unregistered/debit/3ds2check/storecard
      auth: /api/v1/card/unregistered/debit/3ds2Authenticate
      validate: /api/v1/card/unregistered/debit/3ds2Validate
      finish: /api/v1/card/unregistered/debit/3ds2/wof/finish
    sequence: unknown — verify real response contracts and browser challenge
    terminal_rights: unknown
    provider_host: configure sandbox separately, never use hard-coded production URL from Postman
  hold_wof:
    documented: true
    methods:
      create: /api/v1/card/unregistered/hold/register
