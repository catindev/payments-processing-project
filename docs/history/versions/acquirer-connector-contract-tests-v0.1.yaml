title: Проверочные сценарии банковского соединителя
version: 0.1-draft
created_at: '2026-10-09'
run_status: NOT_EXECUTED
notice: Это тестовые сценарии, не отчёт об исполнении. Перед запуском на стенде проверить банковские права, идемпотентность и 
  допустимые тестовые операции.
based_on:
  - payment-lifecycle-spec-v0.2.md
  - acquirer-connector-contract-v0.1.md
  - TKBPAY-v11042025.postman_collection.json
