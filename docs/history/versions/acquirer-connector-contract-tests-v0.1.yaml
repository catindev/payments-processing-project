    category: lifecycle
    bank_scope: generic
    execute_on: simulator_first
    bank_sandbox_prerequisite: active_test_rights_and_scenario_supported
    given_when: submit debit card -> requires_action
    expected: Payment requires_action, next_action задан; paid=0
    result: not_run
